   <!-- TFF -->
   <script src="{{ "/js/tffTools.js" | prepend: site.baseurl }}"></script>
   <script src="{{ "/js/tffData.js" | prepend: site.baseurl }}"></script>
   <script src="{{ "/js/stfvData.js" | prepend: site.baseurl }}"></script>
   
   <script>
      tffData.team1 = { name: {{ site.data.stfv.verein | jsonify }}, league: {{ site.data.stfv.liga | jsonify }}, year: {{ site.data.stfv.jahr | jsonify }} };
      tffData.termine = [
         {% for info in site.data.infos %}
            {datetime: '{{ info.datum }}T{{ info.zeit | default:'00:00' }}' ,datum:'{{ info.datum }}', zeit:'{{ info.zeit }}', typ:'I', titel: {{ info.titel | default:"" | jsonify }}, treff:{{ info.treff | default:"" | jsonify }}, ort:{{ info.ort | default:"" | jsonify }}, ergebnis:{{ info.ergebnis | default:"" | jsonify }}, adresse:{{ info.adresse | default:"" | jsonify }}, adress_url:{{ info.adress_url | default:"" | jsonify }}},
         {% endfor %}
         {% for spiel in site.data.freundschaftspiele %}
            {datetime: '{{ spiel.datum }}T{{ spiel.zeit | default:'21:00' }}' ,datum:'{{ spiel.datum }}', zeit:'{{ spiel.zeit | default:'21:00' }}', typ:'F', gegner:{{ spiel.gegner | default:"" | jsonify }}, ergebnis:{{ spiel.ergebnis | default:"" | jsonify }}, ort:{{ spiel.ort | default:"" | jsonify }}, adresse:{{ spiel.adresse | default:"" | jsonify }}, adress_url:{{ spiel.adress_url | default:"" | jsonify }}},
         {% endfor %}
         {% for spiel in site.data.playoffspiele %}
            {datetime: '{{ spiel.datum }}T{{ spiel.zeit | default:'21:00' }}' ,datum:'{{ spiel.datum }}', zeit:'{{ spiel.zeit | default:'21:00' }}', typ:'O', gegner:{{ spiel.gegner | default:"" | jsonify }}, ergebnis:{{ spiel.ergebnis | default:"" | jsonify }}, ort:{{ spiel.ort | default:"" | jsonify }}, adresse:{{ spiel.adresse | default:"" | jsonify }}, adress_url:{{ spiel.adress_url | default:"" | jsonify }}},
         {% endfor %}
         {% for spiel in site.data.leistungsligaspiele %}
            {datetime: '{{ spiel.datum }}T{{ spiel.zeit | default:'21:00' }}' ,datum:'{{ spiel.datum }}', zeit:'{{ spiel.zeit | default:'21:00' }}', typ:'B', titel: {{ spiel.titel | default:"" | jsonify }}, gegner:{{ spiel.gegner | default:"" | jsonify }}, ergebnis:{{ spiel.ergebnis | default:"" | jsonify }}, ort:{{ spiel.ort | default:"" | jsonify }}, adresse:{{ spiel.adresse | default:"" | jsonify }}, adress_url:{{ spiel.adress_url | default:"" | jsonify }}},
         {% endfor %}
      ]

   </script>

   <script>
      jQuery(document).ready(function() {
         if (typeof tffTools === 'undefined' || typeof stfvData === 'undefined') {
            document.getElementById('eventsLoading').classList.add('d-none');
            var el = document.getElementById('noEvents');
            if (el) { el.textContent = 'Seite konnte nicht geladen werden. Bitte F5 drücken.'; el.classList.remove('d-none'); }
            return;
         }
         tffTools.showTFFData();
      });

      document.addEventListener('visibilitychange', function() {
         if (document.hidden) {
            if (typeof tffData !== 'undefined' && tffData.timer) {
               clearTimeout(tffData.timer);
               tffData.timer = null;
            }
         } else if (typeof tffTools !== 'undefined') {
            tffTools.showTFFData();
         }
      });
   </script>
